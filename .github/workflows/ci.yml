name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cds-lua
      # the vocabulary rock beside the library, where .busted looks for it
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua-fp
          path: cds-lua-fp
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly # vim.async needs 0.13+; switch to stable once it ships
      - uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1"
      - uses: leafo/gh-actions-luarocks@v6
      # --local lands busted under ~/.luarocks, where spec/busted.lua looks
      - run: luarocks --lua-version=5.1 install --local busted
      - run: make test
        working-directory: cds-lua

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cds-lua
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua-fp
          path: cds-lua-fp
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - run: |
          curl -fsSL https://github.com/LuaLS/lua-language-server/releases/download/3.19.2/lua-language-server-3.19.2-linux-x64.tar.gz | tar xz -C "$HOME"
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - run: make typecheck
        working-directory: cds-lua
      - run: make site
        working-directory: cds-lua
      - uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 2.5.2
          args: --check cds-lua/lua cds-lua/spec
      - uses: lunarmodules/luacheck@v1
        with:
          args: cds-lua/lua cds-lua/spec

  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: cds-lua
      - uses: actions/checkout@v7
        with:
          repository: cds-io/cds-lua-fp
          path: cds-lua-fp
      # mini.doc beside the library, where the Makefile looks first
      - uses: actions/checkout@v7
        with:
          repository: nvim-mini/mini.doc
          path: mini.doc
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: nightly
      - name: Help file is current
        run: make doc-check
        working-directory: cds-lua
